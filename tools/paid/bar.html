<!-- THE BAR: the home page's floating pill with the brand and this page's one action. paid.js shows it once the first
     screen's action has scrolled out of sight, and hides it wherever the page shows that action itself. -->
<div class="k-nav k-nav--compact is-scrolled p-bar" data-bar>
  <div class="k-nav__pill">
    <p class="k-brand">{{brand_svg}}<span>Advisor Booking</span></p>
    <a class="k-btn k-btn--sm" href="{{cta_href}}"{{cta_attrs}}><span>{{bar_label}}</span>{{arrow}}</a>
  </div>
</div>
