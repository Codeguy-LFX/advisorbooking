<!-- THE CLOSING CALL TO ACTION: the email box again -->
<section class="k-night p-close" aria-labelledby="closeH" data-bar-hide>
  <div class="p-wrap p-narrow p-close__in">
    <p class="k-eyebrow">Next step</p>
    <h2 class="p-close__h" id="closeH">{{close_h}}</h2>
    <form class="p-ec p-close__go" method="dialog" onsubmit="return false" novalidate data-ec="close"{{ec_attrs}}>
      <div class="k-ec">
        <label class="k-sr-only" for="getEmail2">Your work email</label>
        <input type="email" id="getEmail2" name="email" placeholder="Your work email" autocomplete="email" inputmode="email" aria-describedby="getErr2">
        <input class="k-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" data-1p-ignore="true" data-lpignore="true">
        <button class="k-btn k-btn--accent" type="submit"><span>{{ec_label}}</span>{{arrow}}</button>
      </div>
      <p class="k-ec__err" id="getErr2" role="alert" hidden>Enter a valid work email.</p>
      <p class="k-ec__fine p-alt">This box is not working. <a href="/fit-check" onclick="this.href='/fit-check'+location.search">Go straight to the fit check.</a></p>
      <noscript><p class="k-ec__fine">This box needs JavaScript. Email <a href="mailto:info@advisorbooking.com">info@advisorbooking.com</a> and we will {{ec_ns}}.</p></noscript>
    </form>
    <p class="p-close__f">At least 15 attended, qualified meetings in your first 90 days from launch, or we keep working at our cost.</p>
  </div>
</section>
