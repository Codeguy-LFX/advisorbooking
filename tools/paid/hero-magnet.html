<!-- THE FIRST SCREEN OF THE LINKEDIN PAGE: the free guide is the offer. V6's ground and type; the words on the left and
     the guide's cover on the right (the cover under the email box on a phone). Every line on the cover is from the guide. -->
<section class="p-hero p-hero--home lm-hero" aria-labelledby="rmH">
  <p class="k-brand p-brand">{{brand_svg}}<span>Advisor Booking</span></p>
  <div class="p-wrap lm-grid">
    <div class="p-hero__copy lm-copy">
      <p class="lm-tag"><span class="lm-tag__free">Free guide</span><span>For independent RIAs</span></p>
      <h1 class="p-h1--home lm-h1" id="rmH">A <span class="p-nb">7-day</span> plan to get past prospects <span class="lm-em">back on your calendar.</span></h1>
      <p class="p-sub p-sub--home lm-sub" id="rmS">The Past Prospect Playbook: six emails to copy for the past prospects already in your CRM. <b>No new leads to buy.</b></p>
      {{> hero_action}}
      <script>document.documentElement.classList.remove('rm-swap');   /* this page has one headline: nothing to wait for */</script>
    </div>
    <figure class="lm-art" role="img" aria-label="Cover of the Past Prospect Playbook, a free 7-day guide for independent RIAs">
      <div class="lm-sheet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="lm-cover" aria-hidden="true">
        <p class="lm-cover__top"><span class="lm-cover__brand">{{brand_svg}}<span>Advisor Booking</span></span><span>Free guide</span></p>
        <p class="lm-cover__k">Independent RIAs · $50M+ AUM</p>
        <p class="lm-cover__t">The <em>Past Prospect</em> Playbook</p>
        <p class="lm-cover__s">Finding the meetings that already exist in your CRM</p>
        <div class="lm-days">
          <p class="lm-days__l">The 7-day sequence</p>
          <ol class="lm-days__row" role="list"><li>1</li><li>2</li><li>3</li><li>4</li><li>5</li><li>6</li><li class="is-last"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.6 6.3 5 8.6 9.4 3.7"/></svg></li></ol>
        </div>
        <ul class="lm-cover__list" role="list">
          <li>Who to pull from your CRM</li>
          <li>6 emails to copy</li>
          <li>What to say when they reply</li>
          <li>Compliance checklist</li>
        </ul>
      </div>
      <span class="lm-chip lm-chip--a" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.6 6.3 5 8.6 9.4 3.7"/></svg>6 emails, ready to copy</span>
      <span class="lm-chip lm-chip--b" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.6 6.3 5 8.6 9.4 3.7"/></svg>Compliance checklist included</span>
    </figure>
  </div>
</section>
