<script>
/* 1. The headline variant, from ?v= (appt, leads, mktg, alt or playbook; anything else is appt). It is kept in
      window.AB_V. For any variant but appt the hero copy stays hidden until the script after it has put the right
      words in, so the default headline is never seen.
   2. No font flicker: the first paint waits until Geist (embedded in geist.css) and Geist Mono are ready. A few
      milliseconds as a rule, 300 at most. Without JavaScript nothing is held back and the appt version shows. */
(function (w, d) {
  var h = d.documentElement, m = /[?&]v=([^&#]*)/.exec(w.location.search), v = m ? m[1].toLowerCase() : '', t;
  w.AB_V = /^(leads|mktg|alt|playbook)$/.test(v) ? v : 'appt';
  if (w.AB_V !== 'appt') h.classList.add('rm-swap');
  if (!d.fonts || !d.fonts.load || !w.Promise) return;
  function go() { clearTimeout(t); h.classList.remove('rm-wait'); }
  h.classList.add('rm-wait'); t = setTimeout(go, 300);
  Promise.all([d.fonts.load('500 16px Geist'), d.fonts.load('500 12px "Geist Mono"')]).then(go, go);
})(window, document);
</script>
