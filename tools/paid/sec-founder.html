<!-- THE FOUNDER: the proof a page like this usually gives with a customer quote. The photo is shown whole. The screenshot is
     a plain crop of the owner's own Ads Manager export (whole columns, nothing redrawn): four columns from 700px, three on a phone. -->
<section class="p-sec p-sec--founder" id="founder" aria-labelledby="founderH">
  <div class="p-wrap">
    <div class="p-founder" data-rv>
      <figure class="p-founder__photo">
        <picture>
          <source type="image/webp" srcset="/assets/nick-panel-600.webp 600w, /assets/nick-panel.webp 900w" sizes="(min-width:960px) 500px, (min-width:700px) 42vw, 92vw">
          <img src="/assets/nick-panel.jpg" srcset="/assets/nick-panel-600.jpg 600w, /assets/nick-panel.jpg 900w" sizes="(min-width:960px) 500px, (min-width:700px) 42vw, 92vw" width="900" height="600" alt="Nick De Jesus speaking on stage with a microphone" loading="lazy" decoding="async">
        </picture>
      </figure>
      <div class="p-founder__body">
        <p class="k-eyebrow">Founder</p>
        <h2 class="k-h2 k-h2--md" id="founderH">Nick De Jesus</h2>
        <ul class="p-founder__nums" role="list">
          <li><b>8 figures</b><span>in total ad spend Nick has managed for financial services companies</span></li>
          <li><b>198+</b><span>financial services providers our team has worked with</span></li>
        </ul>
{{founder_new}}
      </div>
{{founder_receipt}}
    </div>
  </div>
</section>
