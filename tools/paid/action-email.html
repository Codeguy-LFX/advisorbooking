<form class="p-ec" id="get" novalidate data-ec="hero">
  <div class="k-ec">
    <label class="k-sr-only" for="getEmail">Work email</label>
    <input type="email" id="getEmail" name="email" placeholder="Your work email" autocomplete="email" inputmode="email" aria-describedby="getErr rmFine">
    <input class="k-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" data-1p-ignore="true" data-lpignore="true">
    <button class="k-btn k-btn--accent" type="submit"><span>Get the free Playbook</span>{{arrow}}</button>
  </div>
  <p class="k-ec__err" id="getErr" role="alert" hidden>Enter a valid work email.</p>
  <p class="k-ec__fine" id="rmFine">Free: the Past Prospect Playbook, our <span class="p-nb">7-day</span> sequence for the past prospects in your CRM. Then a <span class="p-nb">60-second</span> fit check.</p>
</form>
