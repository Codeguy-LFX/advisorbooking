<script>/* Near misses of a real address go to the real page, keeping the campaign tags. This runs before the stylesheets so the
   visitor is not left waiting on them. It only ever goes to an address on this site that is known to exist:
   1. /l1, /l1/q, /l1/dq in the wrong case (GitHub Pages paths are case-sensitive).
   2. A known page typed with a trailing slash or with capitals (/booked/, /Pilot, /Blog/, a blog post with a slash). */
(function () { var p = location.pathname, m = /^\/l1(?:\/(q|dq))?\/?(?:index\.html)?$/i.exec(p);
  if (m) { var want = '/L1/' + (m[1] ? m[1].toUpperCase() + '/' : ''); if (p !== want) location.replace(want + location.search + location.hash); return; }
  var low = p.toLowerCase().replace(/\/+$/, ''), to = '';
  var page = /^\/(book|booked|qualified|ria-meetings-direct|ria-meetings-embed|ria-meetings|ria-playbook|ria-v5|vg-how|vg-guarantee|vg-who|vg-qualify|vg|vl|fit-check|not-a-fit|pilot|meetings|contact|about|privacy|terms|welcome)(?:\.html)?$/.exec(low);
  var old = /^\/(ria-v6|ria-linkedin)(?:\.html)?$/.exec(low);   /* the two pages' earlier addresses */
  if (old) to = old[1] === 'ria-v6' ? '/vg' : '/vl';
  else if (page) to = '/' + page[1];
  else if (/^\/(blog|v1|v2)$/.test(low)) to = low + '/';
  else if (/^\/blog\/[a-z0-9-]+$/.test(low)) to = low;
  if (!to || to === p) return;
  if (String(document.referrer || '').split(/[?#]/)[0] === location.origin + p) return;   /* the server sent our own forward back here: stop */
  location.replace(to + location.search + location.hash); })();</script>
<script src="/assets/gads.js" async></script>
